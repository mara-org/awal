name: Awal
description: Check whether README setup instructions match the repository a fresh developer cloned.
author: Mara
branding:
  icon: check-circle
  color: blue

inputs:
  path:
    description: Repository path to scan.
    required: false
    default: "."
  fail-on:
    description: Severity that blocks the workflow. One of low, medium, high, critical.
    required: false
    default: high
  format:
    description: Report format. One of text, json, csv, sarif.
    required: false
    default: text
  output:
    description: Optional report output path.
    required: false
    default: ""
  python-version:
    description: Python version used to run Awal.
    required: false
    default: "3.12"

outputs:
  report-path:
    description: Report output path, when the output input is set.
    value: ${{ steps.run-awal.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Awal
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"

    - name: Run Awal
      id: run-awal
      shell: bash
      run: |
        set -euo pipefail
        cmd=(awal "${{ inputs.path }}" --fail-on "${{ inputs.fail-on }}" --format "${{ inputs.format }}")
        if [ -n "${{ inputs.output }}" ]; then
          cmd+=(--output "${{ inputs.output }}")
          echo "report-path=${{ inputs.output }}" >> "$GITHUB_OUTPUT"
        fi
        "${cmd[@]}"
