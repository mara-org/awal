[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awal"
version = "0.1.0"
description = "A local README truth checker for fresh-clone developer onboarding."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Mara" }
]
keywords = ["developers", "readme", "onboarding", "devex", "ci", "qa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Documentation",
  "Topic :: Software Development :: Quality Assurance"
]

[project.scripts]
awal = "awal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
